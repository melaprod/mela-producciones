
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador | Mela Producciones</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="login-container">

        <div class="logo">
            <img src="../img/logo mela blanco.png" alt="Mela Producciones">
        </div>

        <h1>Bienvenido</h1>
        <p class="subtitle">Panel administrativo de Mela Producciones</p>

        <form id="login-form">

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Ingresa tu correo"
                    required
                >
            </div>

            
<div class="form-group">

    <label for="password">Contraseña</label>

    <div class="password-wrapper">

        <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña"
            required
        >

        <button
            type="button"
            id="toggle-password"
            class="toggle-password"
            aria-label="Mostrar contraseña"
            title="Mostrar contraseña"
        >
            <i class="fa-solid fa-eye"></i>
        </button>

    </div>

</div>


            <button type="submit">INICIAR SESIÓN</button>

        </form>

        <a href="#" class="forgot-password" id="forgot-password">
            ¿Olvidaste tu contraseña?
        </a>

        <p class="footer">© 2026 Mela Producciones</p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
    </body>
    </html>
